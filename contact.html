<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us - YB SPORT</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body class="bg-dark text-white">

    <div class="container py-5">

        <a href="tp.html"
           class="btn btn-outline-light mb-5">
            ← Back to Home
        </a>

        <div class="text-center mb-5">
            <h1 class="fw-bold">CONTACT US</h1>
            <p class="text-white-50">
                Have a question? We'd love to hear from you.
            </p>
        </div>

        <div class="row g-4">

            <div class="col-md-5">
                <div class="contact-box p-4 h-100">

                    <h3 class="mb-4">Get in Touch</h3>

                    <p>
                        Have any questions about our products?
                        Feel free to contact us.
                    </p>

                    <hr>

                    <h5>Email</h5>
                    <p>youssef.bennouna1@usmba.ac.ma</p>

                    <h5>Phone</h5>
                    <p>+212 674982948</p>

                    <h5>Location</h5>
                    <p>Morocco</p>

                </div>
            </div>

            <div class="col-md-7">
                <div class="contact-box p-4">

                    <h3 class="mb-4">Send a Message</h3>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">
                                Full Name
                            </label>
                            <input type="text"
                                   class="form-control"
                                   placeholder="Your name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email Address
                            </label>
                            <input type="email"
                                   class="form-control"
                                   placeholder="Your email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Subject
                            </label>
                            <input type="text"
                                   class="form-control"
                                   placeholder="Subject">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Your Message
                            </label>
                            <textarea class="form-control"
                                      rows="5"
                                      placeholder="Write your message..."
                                      required></textarea>
                        </div>

                        <button type="button"
                                class="btn contact-btn w-100">
                            Send Message
                        </button>

                    </form>

                </div>
            </div>

        </div>

    </div>
    <style>

.contact-box {
    background-color: #1b1b24;
    border: 1px solid #6f42c1;
    border-radius: 15px;
}

.contact-box h3 {
    color: #b388ff;
}

.contact-box p {
    color: #cccccc;
}

.contact-box .form-control {
    background-color: #292934;
    color: white;
    border: 1px solid #555;
}

.contact-box .form-control::placeholder {
    color: #aaaaaa;
}

.contact-box .form-control:focus {
    background-color: #292934;
    color: white;
    border-color: #9b5de5;
    box-shadow: 0 0 0 0.2rem rgba(155, 93, 229, 0.2);
}

.contact-btn {
    background-color: #6f42c1;
    color: white;
}

.contact-btn:hover {
    background-color: #9b5de5;
    color: white;
}
    </style>

    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
